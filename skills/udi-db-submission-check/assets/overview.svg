<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-label="UDI 数据库提交合规判定器 v1.0.1 概览">
  <!-- background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#132a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#63b3ed"/>
    </linearGradient>
  </defs>
  <rect width="800" height="240" fill="url(#bg)"/>
  <rect x="14" y="14" width="772" height="212" rx="14" fill="none" stroke="#2e6f8e" stroke-width="1.5"/>
  <rect x="14" y="58" width="772" height="3" fill="url(#accent)" opacity="0.85"/>

  <!-- title row -->
  <text x="36" y="45" fill="#e8f1f8" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">UDI 数据库提交合规判定器</text>
  <rect x="640" y="26" width="126" height="24" rx="12" fill="#1d3a52" stroke="#3d7ea6" stroke-width="1"/>
  <text x="703" y="42" fill="#9fd3e8" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="600">v1.0.1 · 2026-10-29</text>

  <!-- subtitle -->
  <text x="36" y="82" fill="#8fb8cc" font-family="Segoe UI,Arial,sans-serif" font-size="13.5">零依赖 CLI · 确定性 JSON IR · 离线可用 · 决策支持（须人工复核）</text>

  <!-- three markets -->
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="36" y="100" width="224" height="58" rx="10" fill="#16324a" stroke="#2e6f8e" stroke-width="1"/>
    <text x="52" y="122" fill="#4fd1c5" font-size="14" font-weight="700">CN 国家药监局 UDI 库</text>
    <text x="52" y="144" fill="#a9c8d8" font-size="12">上市销售前上传并持续维护</text>

    <rect x="288" y="100" width="224" height="58" rx="10" fill="#16324a" stroke="#2e6f8e" stroke-width="1"/>
    <text x="304" y="122" fill="#63b3ed" font-size="14" font-weight="700">US FDA GUDID</text>
    <text x="304" y="144" fill="#a9c8d8" font-size="12">商业流通前提交（GS1/HIBCC/ICCBBA）</text>

    <rect x="540" y="100" width="224" height="58" rx="10" fill="#16324a" stroke="#3d7ea6" stroke-width="1.5"/>
    <text x="556" y="122" fill="#f6ad55" font-size="14" font-weight="700">EU EUDAMED（v1.0.1 新增硬日期）</text>
    <text x="556" y="144" fill="#a9c8d8" font-size="12">四模块 2026-05-28 强制 · 存量登记 2026-11-28 止</text>
  </g>

  <!-- rc legend + footer -->
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="44" cy="186" r="5" fill="#68d391"/><text x="56" y="190" fill="#cfe6f0" font-size="12.5">rc=0 判定完成</text>
    <circle cx="170" cy="186" r="5" fill="#f6ad55"/><text x="182" y="190" fill="#cfe6f0" font-size="12.5">rc=1 带风险提示</text>
    <circle cx="300" cy="186" r="5" fill="#fc8181"/><text x="312" y="190" fill="#cfe6f0" font-size="12.5">rc=2 输入不足/非法</text>
    <circle cx="446" cy="186" r="5" fill="#4fd1c5"/><text x="458" y="190" fill="#cfe6f0" font-size="12.5">rules_verified_on 随输出自带</text>
    <text x="36" y="216" fill="#6f93a8" font-size="11.5">TH-MED-007 · LGD 有籍·有证·有门禁 · 注册老炮@MedXpert · MIT（代码） · https://medxpert.cn/knowledge/</text>
  </g>
</svg>
